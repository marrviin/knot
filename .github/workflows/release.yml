name: Release

# push v* tag -> 打包 macOS 应用并发布 GitHub Release
# （手动触发只打包验证，不发版）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 测试在 ELECTRON_RUN_AS_NODE 下跑，better-sqlite3 需切到 Electron ABI
      # （electron-builder 打包时会再做一次 @electron/rebuild，互不影响）
      - name: Rebuild better-sqlite3 for Electron
        run: pnpm rebuild:electron

      - name: Test
        run: pnpm test

      - name: Build renderer & main & server bundle
        run: pnpm build && pnpm build:server

      - name: Package & publish release
        # electron-builder 在 packages/desktop 内执行（app 目录 = desktop 包），
        # dist-server bundle 由上面的 build:server 产出、经 extraResources 打进 Resources
        run: pnpm --filter @knot/desktop exec electron-builder --mac ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 无签名证书，配合 electron-builder.yml 的 identity: null 走 ad-hoc 签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
